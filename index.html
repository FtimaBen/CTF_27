
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mapillary Image Retrieval</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .image-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        img {
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Mapillary Street Images</h1>
    <div id="results">Loading images...</div>

    <script>
        const ACCESS_TOKEN = "MLY|28889289887380336|b2757a6d408d18aef7a1e6acd1783014";

        async function getImages() {

            const url = new URL(
                "https://graph.mapillary.com/images"
            );

            url.searchParams.set("access_token", ACCESS_TOKEN);
            url.searchParams.set(
                "fields",
                "id,geometry,captured_at,compass_angle,thumb_1024_url"
            );
            url.searchParams.set(
                "bbox",
                "-0.15,51.50,-0.10,51.53"
            );
            url.searchParams.set("limit", "20");

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("API error: " + response.status);
                }

                const data = await response.json();

                const container = document.getElementById("results");

                container.innerHTML = "";

                data.data.forEach(image => {

                    const coordinates =
                        image.geometry?.coordinates || [];

                    const card = document.createElement("div");
                    card.className = "image-card";

                    const img = document.createElement("img");
                    img.src = image.thumb_1024_url;
                    img.alt = "Mapillary street image";

                    const info = document.createElement("p");

                    info.textContent =
                        `ID: ${image.id} | ` +
                        `Longitude: ${coordinates[0]} | ` +
                        `Latitude: ${coordinates[1]} | ` +
                        `Captured: ${image.captured_at || "Unknown"}`;

                    card.appendChild(img);
                    card.appendChild(info);

                    container.appendChild(card);
                });

            } catch (error) {
                document.getElementById("results").textContent =
                    error.message;
            }
        }

        getImages();
    </script>

</body>
</html>
